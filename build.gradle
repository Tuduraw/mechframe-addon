plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Where the base mod lands after running its own `./gradlew publishToMavenLocal`.
	mavenLocal()
}

loom {
	// Same split as the base mod: client-only rendering code stays out of the server jar.
	splitEnvironmentSourceSets()

	// -Pdevtest=<scenario>: compile the automated play test into the client and start the client
	// straight into the "devtest" save running that scenario (development only, never released).
	if (project.hasProperty('devtest')) {
		runs {
			client {
				programArgs "--quickPlaySingleplayer", "devtest"
				vmArg "-Dmechframe.devtest=${project.property('devtest')}"
				vmArg "-Dmechframe.devtest.end=${project.findProperty('devtestEnd') ?: 520}"
				vmArg "-Xmx1400M"
				vmArg "-XX:MaxDirectMemorySize=512M"
				vmArg "-XX:+UseSerialGC"
			}
		}
	}

	mods {
		"mechframe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

if (project.hasProperty('devtest')) {
	sourceSets.client.java.srcDir 'src/devtest/java'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The base mod. Must be the SAME Minecraft/Yarn versions declared above, or the
	// class and method names this addon compiles against won't exist at runtime.
	modImplementation "com.example.tudursvehiclemod:tudursvehiclemod:${project.tudursvehiclemod_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
